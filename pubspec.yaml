name: masjid_alarm_app
description: "Islam Connect - prayer times, azan alarm, Qur'an, Hadith and duas."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^8.0.0
  audioplayers: ^5.2.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  android_intent_plus: ^5.2.0
  flutter_timezone: ^3.0.0
  flutter_foreground_task: ^8.13.0
  shared_preferences: ^2.3.2
  # Reads hadith and Qur'an TRANSLATIONS aloud. Never Arabic - see the comment
  # at the top of lib/services/tts_service.dart.
  #
  # PINNED TO 3.x ON PURPOSE. DO NOT BUMP TO 4.x.
  #
  # flutter_tts 4.x rewrote the Android side in Kotlin and is built against
  # Kotlin 2.2 and compileSdk 36. This project is on Kotlin 1.9 and compileSdk
  # 34, so 4.x fails to compile with hundreds of "incompatible metadata
  # version" errors before it reaches any of our code.
  #
  # 3.x implements the Android side in JAVA, so it has no Kotlin version
  # requirement at all and builds against compileSdk 34 without complaint. The
  # Dart API this app uses is identical in both.
  #
  # ^3.8.5 allows 3.x updates but stops before 4.0.0. Writing ^4.0.2 is what
  # broke the build - pub resolved it to 4.2.5.
  flutter_tts: ^3.8.5
  # Splash video. RANGE-PINNED TO 2.8.x ON PURPOSE.
  #
  # flutter_tts taught this the hard way: a caret range let pub resolve to a
  # major version built against Kotlin 2.2 and compileSdk 36, and the build died
  # with hundreds of errors inside the plugin. 2.9+ raises its Android SDK
  # requirement; this project compiles against 34.
  video_player: '>=2.8.0 <2.9.0'
  flutter_compass: ^0.7.0
  hijri: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  # ADAPTIVE ICON LAYERS.
  #
  # Without these, flutter_launcher_icons produces legacy square icons only, and
  # Android 8+ wraps them in its own shape — usually shrinking the icon inside a
  # white circle, which looks dated beside properly made icons.
  #
  # The foreground is the mark on a transparent background, scaled to 66% so it
  # sits inside the safe zone every launcher mask leaves alone. The background is
  # a flat colour, which is what lets the launcher do its parallax and masking.
  adaptive_icon_background: "#0F5E3A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    # Photographs, cropped and converted to WebP at 1x/2x/3x. Flutter picks the
    # right density automatically from assets/images/2.0x and 3.0x.
    # About 330 KB in total for all three.
    # Default azan. Also copied into android/app/src/main/res/raw/azan.mp3 by
    # the CI workflow, where Android needs it to serve as a notification
    # channel sound. Both copies are the same file - replace both to change it.
    - assets/audio/azan.mp3
    # 132 dua chapters from Hisn al-Muslim, with Arabic and English. This was
    # NEVER DECLARED, so DuaRepository would have thrown on rootBundle.loadString
    # the first time anything opened the duas screen — which nothing did, because
    # nothing navigated to it either.
    - assets/duas/duas_en.json
    - assets/video/intro.mp4
    - assets/fonts/NotoNastaliqUrdu-LICENSE-OFL.txt
    - assets/images/nabawi_header.webp
    - assets/images/kaaba_dial.webp
    - assets/images/quran_header.webp
    - assets/icon/app_icon.png
    - assets/quran/quran_en.json
    - assets/quran/quran_ur.json
    - assets/quran/quran_hi_lookup.json
    - assets/hadith/eng_bukhari.json
    - assets/hadith/urd_bukhari.json
    - assets/hadith/ara_bukhari.json
    - assets/hadith/eng_muslim.json
    - assets/hadith/urd_muslim.json
    - assets/hadith/ara_muslim.json
    - assets/hadith/eng_abudawud.json
    - assets/hadith/urd_abudawud.json
    - assets/hadith/ara_abudawud.json
    - assets/hadith/eng_tirmidhi.json
    - assets/hadith/urd_tirmidhi.json
    - assets/hadith/ara_tirmidhi.json
    - assets/hadith/eng_nasai.json
    - assets/hadith/urd_nasai.json
    - assets/hadith/ara_nasai.json
    - assets/hadith/eng_ibnmajah.json
    - assets/hadith/urd_ibnmajah.json
    - assets/hadith/ara_ibnmajah.json
    # Urdu chapter-title overrides. Ships empty; see the _readme inside.
    - assets/hadith/urd_sections.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    # The Madani Mushaf face. Used for QUR'AN TEXT ONLY.
    #
    # LICENCE WARNING: the package this came from carries no licence file — its
    # readme is a font-aggregator page. KFGQPC fonts are produced by the King
    # Fahd Glorious Qur'an Printing Complex and are free to use, but their terms
    # come from the Complex, not from a download site. Get the official release
    # and read its terms before publishing commercially.
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs.otf
    # Urdu. SIL Open Font License — licence text bundled beside it, which OFL
    # requires when redistributing.
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
    # OPTIONAL UPGRADE — the display face.
    #
    # The UI currently uses Android's built-in 'serif' (see AppFonts.serif in
    # lib/theme/app_theme.dart), so it builds with no extra files. To use
    # Cormorant Garamond instead:
    #   1. put the two .ttf files below into assets/fonts/
    #   2. uncomment this block
    #   3. change AppFonts.serif to 'Cormorant'
    # Do all three or none — a declared font file that isn't there fails the
    # build, and a family name with no declaration silently falls back.
    #
    # - family: Cormorant
    #   fonts:
    #     - asset: assets/fonts/CormorantGaramond-Regular.ttf
    #       weight: 400
    #     - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
    #       weight: 600

name: Deploy international admin verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required secrets
        env:
          DEPLOY: ${{ secrets.FIREBASE_DEPLOY_CREDENTIALS }}
        run: |
          if [ -z "$DEPLOY" ]; then
            echo 'Configure FIREBASE_DEPLOY_CREDENTIALS. No email service is required. See INTERNATIONAL_ADMINS_SETUP.md.'
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_CREDENTIALS }}
      - name: Install registration backend dependencies
        run: npm --prefix functions-international ci --ignore-scripts
      - name: Test SMS identity and country validation
        run: npm --prefix functions-international test
      - name: Deploy registration and verified admin endpoints
        run: npx --yes firebase-tools@14 --config firebase.registration.json deploy --only functions:international-admins --project actual-masjid-prayer-time --non-interactive --force
      - name: Verify registration endpoint is deployed in the app region
        run: |
          npx --yes firebase-tools@14 functions:list --json --project actual-masjid-prayer-time > "$RUNNER_TEMP/registration-functions.json"
          node scripts/check-registration-deployment.js "$RUNNER_TEMP/registration-functions.json"

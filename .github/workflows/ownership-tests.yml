name: Ownership transfer validation
on:
  push:
    paths:
      - 'functions/**'
      - '.github/workflows/ownership-tests.yml'
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/ownership-tests.yml'
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check functions/index.js
      - run: node --test functions/test/*.test.js

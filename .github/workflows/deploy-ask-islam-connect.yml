name: Deploy Ask Islam Connect AI (Gemini)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ASK_AI_PROVIDER: gemini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required repository secrets
        env:
          DEPLOY_CREDENTIALS: ${{ secrets.FIREBASE_DEPLOY_CREDENTIALS }}
          GEMINI_KEY: ${{ secrets.ASK_GEMINI_API_KEY }}
        run: |
          AI_KEY="$GEMINI_KEY"
          if [ -z "$DEPLOY_CREDENTIALS" ] || [ -z "$AI_KEY" ]; then
            echo 'Configure FIREBASE_DEPLOY_CREDENTIALS and ASK_GEMINI_API_KEY repository secret. Read ASK_AI_SETUP.md.'
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_CREDENTIALS }}
      - name: Install backend dependencies
        run: npm --prefix functions-ask ci --ignore-scripts
      - name: Validate story assets and reference targets
        run: python3 scripts/check_prophet_stories.py
      - name: Build library from current app assets
        run: npm --prefix functions-ask run build:corpus
      - name: Check full library loading and search within memory budget
        run: node --max-old-space-size=512 functions-ask/check-corpus.js
      - name: Check conversational retrieval memory and evidence
        run: node --max-old-space-size=768 functions-ask/check-assistant-corpus.js
      - name: Check natural question retrieval relevance
        run: node --max-old-space-size=768 functions-ask/check-quality-retrieval.js
      - name: Test AI orchestration and citation validation
        run: npm --prefix functions-ask test
      - name: Check selected provider access before deployment
        env:
          GEMINI_KEY: ${{ secrets.ASK_GEMINI_API_KEY }}
        run: |
          export AI_KEY="$GEMINI_KEY"
          node functions-ask/check-provider.js
      - name: Store provider key in Firebase Secret Manager
        env:
          GEMINI_KEY: ${{ secrets.ASK_GEMINI_API_KEY }}
        run: |
          export AI_KEY="$GEMINI_KEY"
          secret_name="ASK_GEMINI_API_KEY"
          umask 077
          key_file="$RUNNER_TEMP/islam-connect-ai-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$AI_KEY" > "$key_file"
          npx --yes firebase-tools@14 --project actual-masjid-prayer-time functions:secrets:set "$secret_name" --data-file "$key_file" --non-interactive
      - name: Configure selected provider
        run: |
          touch functions-ask/.env.actual-masjid-prayer-time
          sed -i '/^ASK_AI_PROVIDER=/d' functions-ask/.env.actual-masjid-prayer-time
          printf '\nASK_AI_PROVIDER=%s\n' "$ASK_AI_PROVIDER" >> functions-ask/.env.actual-masjid-prayer-time
      - name: Deploy only the Ask AI service
        run: npx --yes firebase-tools@14 --config firebase.ask.json deploy --only functions:ask-islam-connect --project actual-masjid-prayer-time --non-interactive --force

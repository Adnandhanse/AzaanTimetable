name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate platform folders
        run: flutter create --platforms=android --project-name masjid_alarm_app .
        - name: Relocate MainActivity to the com.islamconnect.app package
        run: |
          OLD_PATH="android/app/src/main/kotlin/com/example/masjid_alarm_app/MainActivity.kt"
          NEW_DIR="android/app/src/main/kotlin/com/islamconnect/app"
          NEW_PATH="$NEW_DIR/MainActivity.kt"

          if [ ! -f "$OLD_PATH" ]; then
            echo "ERROR: expected generated file not found at $OLD_PATH"
            find android/app/src/main/kotlin -name "MainActivity.kt"
            exit 1
          fi

          mkdir -p "$NEW_DIR"
          sed 's/^package com\.example\.masjid_alarm_app$/package com.islamconnect.app/' "$OLD_PATH" > "$NEW_PATH"
          rm -f "$OLD_PATH"
          rmdir --ignore-fail-on-non-empty android/app/src/main/kotlin/com/example/masjid_alarm_app 2>/dev/null || true
          rmdir --ignore-fail-on-non-empty android/app/src/main/kotlin/com/example 2>/dev/null || true

          echo "--- moved MainActivity.kt to: $NEW_PATH ---"
          cat "$NEW_PATH"

      - name: Show actual default applicationId
        run: |
          echo "--- default app/build.gradle applicationId ---"
          grep -A1 "applicationId" android/app/build.gradle || grep -A1 "applicationId" android/app/build.gradle.kts

      - name: Overwrite settings.gradle with fixed Kotlin + Google Services plugin
        run: |
          cat > android/settings.gradle << 'GRADLE_EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.24" apply false
              id "com.google.gms.google-services" version "4.4.2" apply false
          }

          include ":app"
          GRADLE_EOF
          echo "--- settings.gradle now contains ---"
          cat android/settings.gradle

      - name: Bump Gradle wrapper version
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Overwrite app/build.gradle with Google Services + minSdk + stable signing
        run: |
          cat > android/app/build.gradle << 'APPGRADLE_EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services"
          }

          android {
              namespace = "com.islamconnect.app"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
                  coreLibraryDesugaringEnabled = true
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_1_8
              }

              defaultConfig {
                  // The published identity of the app. Can never change once live —
                  // a different applicationId is a different app to Google.
                  //
                  // NOT the same as the Dart package name in pubspec.yaml,
                  // which stays masjid_alarm_app. That one appears in every
                  // `import 'package:masjid_alarm_app/...'` in the codebase and
                  // renaming it would touch every file for no benefit; Google
                  // never sees it.
                  applicationId = "com.islamconnect.app"
                  minSdk = 23
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  release {
                      // Credentials come from the environment, NOT from this
                      // file. They were written here in plain text alongside a
                      // committed keystore, which means anyone who can read the
                      // repo can sign builds as you.
                      //
                      // Set these as GitHub repository secrets. If they are
                      // absent the build still works using the old values, so
                      // nothing breaks before you add them — but do add them.
                      storeFile file("../../android_keystore/release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: "masjidalarm123"
                      keyAlias System.getenv("KEY_ALIAS") ?: "masjidalarm"
                      keyPassword System.getenv("KEY_PASSWORD") ?: "masjidalarm123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }

          flutter {
              source = "../.."
          }
          APPGRADLE_EOF
          echo "--- app/build.gradle now contains ---"
          cat android/app/build.gradle

      - name: Place google-services.json
        run: |
          if [ -f "firebase_config/google-services.json" ]; then
            cp firebase_config/google-services.json android/app/google-services.json
            echo "google-services.json copied successfully."
          else
            echo "ERROR: firebase_config/google-services.json not found in repo!"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons

      - name: Auto-fix any plugin missing a namespace declaration
        run: |
          python3 << 'PYEOF'
          import os, re, glob

          pub_cache = os.path.expanduser(os.environ.get("PUB_CACHE", os.path.expanduser("~/.pub-cache")))
          gradle_files = glob.glob(f"{pub_cache}/**/android/build.gradle", recursive=True)

          for gradle_path in gradle_files:
              with open(gradle_path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              if "namespace" in content:
                  continue  # already has one, skip

              # Find the matching AndroidManifest.xml's package attribute
              manifest_path = os.path.join(os.path.dirname(gradle_path), "src", "main", "AndroidManifest.xml")
              if not os.path.exists(manifest_path):
                  continue
              with open(manifest_path, "r", encoding="utf-8", errors="ignore") as f:
                  manifest = f.read()
              match = re.search(r'package="([^"]+)"', manifest)
              if not match:
                  continue
              package_name = match.group(1)

              # Insert namespace as the first line inside the android { } block
              new_content = re.sub(
                  r'(android\s*\{)',
                  f'\\1\n    namespace "{package_name}"',
                  content,
                  count=1
              )
              if new_content != content:
                  with open(gradle_path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Patched namespace '{package_name}' into {gradle_path}")

          # Also force a modern compileSdk (34) on any plugin declaring a
          # lower one - older plugins can specify a low compileSdk that's
          # missing newer AndroidX resources (like android:attr/lStar),
          # causing resource-merge failures even though our own app
          # compiles against a modern SDK.
          for gradle_path in gradle_files:
              with open(gradle_path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              def bump(match):
                  keyword, value = match.group(1), match.group(2)
                  try:
                      if int(value) < 34:
                          return f'{keyword} 34'
                  except ValueError:
                      pass
                  return match.group(0)

              new_content = re.sub(r'(compileSdkVersion|compileSdk)\s+(\d+)', bump, content)
              if new_content != content:
                  with open(gradle_path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Bumped compileSdk to 34 in {gradle_path}")
          PYEOF

      - name: Inspect flutter_foreground_task's actual native requirements
        run: |
          echo "=== flutter_foreground_task's own AndroidManifest.xml ==="
          find "$HOME/.pub-cache" -path "*flutter_foreground_task*/android/src/main/AndroidManifest.xml" -exec cat {} \;
          echo ""
          echo ""
          echo "=== flutter_foreground_task's build.gradle ==="
          find "$HOME/.pub-cache" -path "*flutter_foreground_task*/android/build.gradle" -exec cat {} \;

      - name: Set proper app display name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Islam Connect"/' android/app/src/main/AndroidManifest.xml
          echo "--- confirming app label ---"
          grep "android:label" android/app/src/main/AndroidManifest.xml

      - name: Add location and notification permissions to AndroidManifest.xml
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <category android:name="android.intent.category.BROWSABLE" />\n            <data android:scheme="https" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="geo" />\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml
          echo "--- AndroidManifest.xml permissions ---"
          grep "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Install the azan as an Android raw resource
        run: |
          # Android can only use a notification channel sound from res/raw.
          # The android/ folder is generated by `flutter create`, so the file
          # has to be copied in on every build - it cannot live there in git.
          mkdir -p android/app/src/main/res/raw
          if [ -f "assets/audio/azan.mp3" ]; then
            cp assets/audio/azan.mp3 android/app/src/main/res/raw/azan.mp3
            echo "azan.mp3 installed as a raw resource:"
            ls -la android/app/src/main/res/raw/
          else
            echo "ERROR: assets/audio/azan.mp3 missing - the notification channel"
            echo "declares this sound, and the build will fail without it."
            exit 1
          fi

      - name: Add required foreground service declaration (plugin needs this manually)
        run: |
          sed -i 's#</application>#    <service\n        android:name="com.pravera.flutter_foreground_task.service.ForegroundService"\n        android:foregroundServiceType="mediaPlayback"\n        android:exported="false" />\n</application>#' android/app/src/main/AndroidManifest.xml
          echo "--- confirming service declaration added ---"
          grep -A4 "ForegroundService" android/app/src/main/AndroidManifest.xml

      - name: Patch all plugin compileSdk to 34 (avoid corrupted SDK 35 jar on CI)
        run: |
          find "$HOME/.pub-cache" -name "build.gradle" -exec sed -i \
            -e 's/compileSdk[[:space:]]*=\?[[:space:]]*35/compileSdk 34/g' \
            -e 's/compileSdkVersion[[:space:]]*35/compileSdkVersion 34/g' {} +
          find "$HOME/.pub-cache" -name "build.gradle.kts" -exec sed -i \
            -e 's/compileSdk[[:space:]]*=\?[[:space:]]*35/compileSdk = 34/g' {} +

      - name: Fix plugins with broken 'flutter.xxxSdkVersion' references
        run: |
          find "$HOME/.pub-cache" -name "build.gradle" -exec sed -i \
            -e 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 34/g' \
            -e 's/compileSdk flutter\.compileSdkVersion/compileSdk 34/g' \
            -e 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/g' \
            -e 's/minSdk flutter\.minSdkVersion/minSdk 23/g' \
            -e 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 34/g' \
            -e 's/targetSdk flutter\.targetSdkVersion/targetSdk 34/g' {} +

      # BOTH FORMATS, on purpose.
      #
      # Play requires an App Bundle (.aab) for new apps — an APK upload is
      # rejected outright. But an .aab cannot be sideloaded onto a phone, so the
      # APK stays for testing on your own devices.
      - name: Build APK (release) — for sideloading and testing
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build App Bundle (release) — for the Play Store
        run: flutter build appbundle --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Show final merged AndroidManifest.xml
        run: |
          echo "=== Searching for merged manifest ==="
          find android -iname "AndroidManifest.xml" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || echo "No manifest files found (non-fatal, continuing)."
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: islam-connect-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: islam-connect-aab
          path: build/app/outputs/bundle/release/app-release.aab
